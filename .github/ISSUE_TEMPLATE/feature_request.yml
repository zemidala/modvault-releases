name: Feature request / Предложение
description: Suggest a new feature or an improvement. / Предложите новую возможность или улучшение.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Not sure yet? Discuss the idea first in [Discussions → Ideas](https://github.com/zemidala/modvault-releases/discussions/categories/ideas).
        Не уверены? Сначала обсудите идею в [Discussions → Ideas](https://github.com/zemidala/modvault-releases/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve? / Какую задачу решает?
      placeholder: "I want to ... because ... / Хочу ..., потому что ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work? / Как это должно работать?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / Область
      options:
        - Deploy, files in the game / Развёртывание, файлы в игре
        - Load order, sorting, checks / Порядок загрузки, сортировка, проверки
        - File conflicts / Конфликты файлов
        - Diagnosis, faulty mod search / Диагностика, поиск сбойного мода
        - Nexus, downloads, updates / Nexus, загрузки, обновления
        - Mod sets, collections / Наборы, коллекции
        - Window, settings, translation / Окно, настройки, перевод
        - Other games / Другие игры
        - Other / Другое
  - type: textarea
    id: extra
    attributes:
      label: Anything else? / Что-то ещё?
      description: Mockups, screenshots, how other mod managers do it. / Наброски, скриншоты, как это сделано в других менеджерах модов.
